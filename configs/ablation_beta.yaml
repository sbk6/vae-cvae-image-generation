dataset:
  name: mnist
  image_size: [28, 28]
  channels: 1
  num_classes: 10
  condition_mode: one_hot
  # Sous-échantillon du train set pour accélérer l'étude d'ablation sur CPU.
  # Le val/test restent complets pour garder une mesure fiable.
  train_subset: 12000
ablation:
  betas: [0.1, 1.0, 5.0]
  seeds: [0, 42, 123]
model:
  type: vae
  latent_dim: 16
  hidden_channels: 32
training:
  seed: 42
  batch_size: 128
  epochs: 20
  lr: 0.001
  device: auto
  output_dir: reports/experiments/ablation_seeds
  mlflow:
    enabled: true
    tracking_uri: sqlite:///mlflow.db
    experiment_name: vae-cvae-mnist-ablation
    tags:
      phase: ablation
