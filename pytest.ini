[pytest]
# La suite unitaire vit dans tests/. Sans ce cadrage, pytest remonte aussi
# projects/, ou trois copies de deployment/test_serving.py portent le meme
# nom de module (l'original de David plus les copies embarquees par MLflow
# dans deployment/packaged_models/*/code/), ce qui casse la collecte.
#
# Ces tests de serving MLflow ne sont de toute facon pas des tests unitaires :
# ils exigent des serveurs deja lancés et se lancent a la main, voir
# projects/david_fashion_mnist/deployment/README.md.
testpaths = tests
