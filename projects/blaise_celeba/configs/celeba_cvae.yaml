dataset:
  name: celeba
  image_size: [64, 64]
  channels: 3
  attributes: [Smiling, Male, Wavy_Hair]
  seed: 42
  n_train: 8000
  n_val: 1500
  n_test: 1500
model:
  type: cvae
  # Meme capacite que le VAE ameliore pour garder une comparaison juste.
  latent_dim: 128
  hidden_channels: 64
training:
  seed: 42
  batch_size: 64
  epochs: 80
  lr: 0.001
  beta: 0.5
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 1.0
  kl_annealing:
    enabled: true
    start_beta: 0.0
    final_beta: 0.5
    warmup_epochs: 10
  device: auto
  output_dir: results/experiments/cvae_improved
