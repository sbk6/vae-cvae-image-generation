dataset:
  name: celeba
  image_size: [64, 64]
  channels: 3
  attributes: [Smiling, Male, Wavy_Hair]
  seed: 42
  # Sous-echantillon (l'enonce le demande explicitement pour CelebA) : voir
  # data/dataset.py pour la justification du tirage aleatoire plutot qu'un
  # prefixe, et le README pour la justification de la taille.
  n_train: 8000
  n_val: 1500
  n_test: 1500
model:
  type: vae
  # Configuration amelioree : plus de capacite pour des visages couleur que
  # le baseline historique latent_dim=64 / hidden_channels=32.
  latent_dim: 128
  hidden_channels: 64
training:
  seed: 42
  batch_size: 64
  # Budget haut, controle par early stopping : l'entrainement peut aller loin
  # si la validation continue de progresser, mais s'arrete quand il stagne.
  epochs: 80
  lr: 0.001
  # Candidat a tester apres l'ablation fine : moins fort que 1.0 pour limiter
  # le flou MSE/KL, tout en gardant un espace latent regularise.
  beta: 0.5
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0
  kl_annealing:
    enabled: true
    start_beta: 0.0
    final_beta: 0.5
    warmup_epochs: 10
  device: auto
  output_dir: results/experiments/vae_improved
mlflow:
  enabled: true
  tracking_uri: sqlite:///mlflow.db
  experiment_name: blaise_celeba
  run_name: vae_improved
  tags:
    stage: improved_training
